name: Build Samsung A04 Kernel with SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version tag'
        required: false
        default: 'android-4.19-stable'
      enable_kernelsu:
        description: 'Enable KernelSU'
        type: boolean
        default: true
        required: false

env:
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_HARDLINK: "true"

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Load configuration
        run: |
          if [ -f "config.env" ]; then
            echo "Loading config.env..."
            while IFS='=' read -r key value; do
              if [[ ! $key =~ ^# ]] && [[ -n $key ]]; then
                echo "$key=${value//\"/}"
                echo "$key=${value//\"/}" >> $GITHUB_ENV
              fi
            done < <(sed 's/ *= */=/g' config.env)
          else
            echo "config.env not found, using defaults"
            echo "KERNEL_SOURCE=https://github.com/rsuntkOrgs/kernel_samsung_wingtech" >> $GITHUB_ENV
            echo "KERNEL_SOURCE_BRANCH=android-4.19-stable" >> $GITHUB_ENV
            echo "KERNEL_CONFIG=rsuntk-a04_defconfig" >> $GITHUB_ENV
            echo "CLANG_BRANCH=master-kernel-build-2022" >> $GITHUB_ENV
            echo "CLANG_VERSION=r450784e" >> $GITHUB_ENV
            echo "ENABLE_KERNELSU=true" >> $GITHUB_ENV
          fi
          
          # Override with workflow_dispatch inputs if provided
          if [[ "${{ github.event.inputs.kernel_version }}" != "" ]]; then
            echo "KERNEL_SOURCE_BRANCH=${{ github.event.inputs.kernel_version }}" >> $GITHUB_ENV
          fi
          if [[ "${{ github.event.inputs.enable_kernelsu }}" != "" ]]; then
            echo "ENABLE_KERNELSU=${{ github.event.inputs.enable_kernelsu }}" >> $GITHUB_ENV
          fi

      - name: Setup build environment
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential zip curl \
            zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
            libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc \
            libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev \
            libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3 \
            perl
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # Setup ccache
          sudo mkdir -p /usr/local/ccache
          sudo chmod 777 /usr/local/ccache
          export CCACHE_DIR="/usr/local/ccache"
          ccache -M 10G
          ccache -s

      - name: Download toolchains
        run: |
          mkdir -p toolchains
          cd toolchains
          
          # Download Clang
          echo "Downloading Clang..."
          mkdir -p clang
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$CLANG_BRANCH/clang-$CLANG_VERSION.tar.gz"
          tar -C clang/ -zxvf "clang-$CLANG_VERSION.tar.gz"
          
          # Download GCC 64-bit
          echo "Downloading GCC 64-bit..."
          mkdir -p gcc64
          wget -q -O gcc64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc64/ -zxvf gcc64.tar.gz
          
          # Download GCC 32-bit
          echo "Downloading GCC 32-bit..."
          mkdir -p gcc32
          wget -q -O gcc32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc32/ -zxvf gcc32.tar.gz
          
          # Set toolchain paths
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV
          echo "GCC64_PATH=$(pwd)/gcc64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "GCC32_PATH=$(pwd)/gcc32/bin/arm-linux-androideabi-" >> $GITHUB_ENV

      - name: Clone kernel source
        run: |
          echo "Cloning kernel source from $KERNEL_SOURCE branch $KERNEL_SOURCE_BRANCH"
          git clone --depth=1 --branch="$KERNEL_SOURCE_BRANCH" "$KERNEL_SOURCE" kernel-source
          cd kernel-source
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Setup KernelSU
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $KERNEL_DIR
          echo "Setting up KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
          # Fix KernelSU for 4.19 kernel
          if [ -f "drivers/kernelsu/allowlist.c" ]; then
            echo "Fixing KernelSU for 4.19 kernel..."
            sed -i 's/TWA_RESUME/0/g' drivers/kernelsu/allowlist.c 2>/dev/null || true
          fi

      - name: Fix kernel source issues
        run: |
          cd $KERNEL_DIR
          echo "Fixing common kernel source issues..."
          
          # Fix line endings
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "Makefile*" -o -name "Kconfig*" \) \
            -exec sed -i 's/\r//g' {} + 2>/dev/null || true
          
          # Fix Kconfig plus signs
          find drivers/input/touchscreen/ -name "Kconfig*" -exec sed -i 's/^+//g' {} + 2>/dev/null || true
          
          # Fix MTK driver syntax
          [ -f "drivers/input/input_booster.c" ] && sed -i 's/int is_ib_init_succeed() {/int is_ib_init_succeed(void) {/' drivers/input/input_booster.c
          
          # Remove unsupported macro for 4.19
          find . -name "ksu.c" -exec sed -i '/MODULE_IMPORT_NS/d' {} + 2>/dev/null || true
          
          # Fix mtk_trace header issue
          if [ -f "kernel/trace/mtk_trace.c" ]; then
            echo "Fixing mtk_trace header..."
            sed -i 's|#include "./mtk_ftrace.h"|#include "mtk_ftrace.h"|g' kernel/trace/mtk_trace.c 2>/dev/null || true
          fi
          
          # Create missing mtk_ftrace.h if needed
          if [ ! -f "kernel/trace/mtk_ftrace.h" ] && [ -f "kernel/trace/mtk_trace.c" ]; then
            echo "Creating mtk_ftrace.h..."
            mkdir -p kernel/trace
            cat > kernel/trace/mtk_ftrace.h << 'EOF'
#ifndef _MTK_FTRACE_H
#define _MTK_FTRACE_H

#include <linux/trace_events.h>

/* Empty header for compatibility */

#endif
EOF
          fi

      - name: Configure kernel
        run: |
          cd $KERNEL_DIR
          echo "Configuring kernel..."
          
          # Set up environment
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=$GCC64_PATH
          export CROSS_COMPILE_ARM32=$GCC32_PATH
          
          # Make clean
          make clean || true
          make mrproper || true
          
          # Generate defconfig
          make $KERNEL_CONFIG
          
          # Add required configurations
          echo "Adding required kernel configurations..."
          cat >> .config << 'EOF'
# KernelSU
CONFIG_KSU=y
CONFIG_KSU_SUKI_ULTRA=y
CONFIG_MODULES=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_OVERLAY_FS=y
# Disable problematic features
CONFIG_MTK_TRACE=n
# Essential features
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
EOF
          
          # Update config
          make olddefconfig
          
          # Show important configs
          echo "Important configurations:"
          grep -E "CONFIG_(KSU|MODULES|KPROBES|MTK_TRACE)=" .config || true

      - name: Build kernel
        run: |
          cd $KERNEL_DIR
          echo "Building kernel..."
          
          # Set up environment
          export PATH=$CLANG_PATH:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=$GCC64_PATH
          export CROSS_COMPILE_ARM32=$GCC32_PATH
          
          # Disable all warnings
          export KCFLAGS="-w -Wno-everything -Wno-unused-command-line-argument"
          export KBUILD_CFLAGS="-w -Wno-everything"
          
          # Build with ccache
          export CC="ccache clang"
          
          # Build kernel
          echo "Starting build with $(nproc --all) cores..."
          
          # Try multiple build methods
          BUILD_SUCCESS=false
          
          # Method 1: Clang with full suppression
          echo "=== Method 1: Clang build ==="
          set +e
          make -j$(nproc --all) \
            CC="clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            LD=ld.lld \
            2>&1 | tee build.log
          
          if [ $? -eq 0 ] && [ -f "arch/arm64/boot/Image.gz" ]; then
            BUILD_SUCCESS=true
            echo "✅ Clang build successful!"
          else
            echo "Clang build failed, trying GCC..."
            
            # Method 2: GCC fallback
            echo "=== Method 2: GCC build ==="
            make clean
            make -j$(nproc --all) 2>&1 | tee build_gcc.log
            
            if [ $? -eq 0 ] && [ -f "arch/arm64/boot/Image.gz" ]; then
              BUILD_SUCCESS=true
              echo "✅ GCC build successful!"
            fi
          fi
          set -e
          
          if [ "$BUILD_SUCCESS" = "false" ]; then
            echo "❌ All build methods failed"
            echo "=== Build errors ==="
            grep -i "error:" build.log 2>/dev/null | head -20 || true
            grep -i "error:" build_gcc.log 2>/dev/null | head -20 || true
            exit 1
          fi
          
          # Show build info
          echo "Build completed successfully!"
          ls -lh arch/arm64/boot/Image.gz
          echo "Kernel size: $(stat -c%s arch/arm64/boot/Image.gz) bytes"
          
          # Save kernel info
          strings arch/arm64/boot/Image.gz | grep "Linux version" | head -1 > kernel_version.txt

      - name: Package kernel
        if: success()
        run: |
          cd $KERNEL_DIR
          echo "Packaging kernel..."
          
          # Create output directory
          mkdir -p $GITHUB_WORKSPACE/output
          
          # Copy kernel image
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            cp arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/output/
          elif [ -f "arch/arm64/boot/Image" ]; then
            gzip -c arch/arm64/boot/Image > $GITHUB_WORKSPACE/output/Image.gz
          fi
          
          # Copy modules if they exist
          if [ -d "modules" ]; then
            cp -r modules $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          fi
          
          # Copy config
          cp .config $GITHUB_WORKSPACE/output/kernel.config 2>/dev/null || true
          
          # Create zip
          cd $GITHUB_WORKSPACE/output
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          ZIP_NAME="kernel_a04_${TIMESTAMP}.zip"
          zip -r "$ZIP_NAME" ./*
          
          echo "✅ Package created: $ZIP_NAME"
          ls -lh "$ZIP_NAME"
          
          # Save zip name
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a04
          path: |
            ${{ github.workspace }}/output/*.zip
            ${{ github.workspace }}/output/Image.gz
            ${{ github.workspace }}/output/kernel.config
          retention-days: 7

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/kernel-source/build.log
            ${{ github.workspace }}/kernel-source/build_gcc.log
            ${{ github.workspace }}/kernel-source/.config
          retention-days: 30

      - name: Show success message
        if: success()
        run: |
          echo "=========================================="
          echo "✅ Kernel build completed successfully!"
          echo "📦 Artifact: kernel-a04"
          echo "⏱️  Build time: $BUILD_TIME"
          echo "=========================================="
