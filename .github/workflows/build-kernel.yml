name: Build Samsung A04 SukiSU-Ultra
on:
  workflow_dispatch:

jobs:
  build:
    name: Build SukiSU-Ultra by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Configuration
        run: |
          if [ -f "config.env" ]; then
            sed -i 's/ *= */=/g' config.env
            grep -v '^#' config.env | grep '=' >> $GITHUB_ENV
          else
            echo "Error: config.env not found!"
            exit 1
          fi

      - name: Setup build kernel environment
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential zip curl \
            zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
            libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc \
            libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev \
            libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3 \
            patch
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: Download Clang and GCC
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          # Clang
          mkdir -p clang-aosp
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/clang-${{ env.CLANG_VERSION }}.tar.gz"
          tar -C clang-aosp/ -zxvf "clang-${{ env.CLANG_VERSION }}.tar.gz"
          # GCC 64
          mkdir -p gcc-64
          wget -q -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc-64/ -zxvf gcc-aarch64.tar.gz
          # GCC 32
          mkdir -p gcc-32
          wget -q -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc-32/ -zxvf gcc-arm.tar.gz

      - name: Download kernel source
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

      - name: Setup SukiSU-Ultra
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: Pre-process Kernel Source
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          # 修复换行符
          echo "修复换行符..."
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "Makefile*" -o -name "Kconfig*" \) \
            -exec sed -i 's/\r//g' {} + 2>/dev/null || true
          
          # 修复Kconfig中的+号问题
          find drivers/input/touchscreen/ -name "Kconfig*" -exec sed -i 's/^+//g' {} + 2>/dev/null || true

      - name: Fix KernelSU Compatibility
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          echo "=== 修复KernelSU兼容性 ==="
          
          # 修复TWA_RESUME问题 - 对于4.19内核
          KSU_ALLOWLIST="drivers/kernelsu/allowlist.c"
          if [ -f "$KSU_ALLOWLIST" ]; then
            echo "修复KernelSU allowlist.c..."
            
            # 备份原文件
            cp "$KSU_ALLOWLIST" "${KSU_ALLOWLIST}.bak"
            
            # 方法1: 替换TWA_RESUME为正确的值
            # 在Linux内核中，TWA_RESUME的值通常是0
            sed -i 's/TWA_RESUME/TWA_SIGNAL/' "$KSU_ALLOWLIST" 2>/dev/null || \
            sed -i 's/TWA_RESUME/0/' "$KSU_ALLOWLIST" 2>/dev/null || true
            
            # 方法2: 如果没有task_work.h头文件，添加兼容性定义
            if ! grep -q "#include <linux/task_work.h>" "$KSU_ALLOWLIST"; then
              sed -i '1i #ifndef TWA_SIGNAL\n#define TWA_SIGNAL 0\n#endif' "$KSU_ALLOWLIST"
            fi
            
            echo "KernelSU修复完成"
          fi

      - name: Fix GPU Driver Issues
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          echo "=== 修复GPU驱动问题 ==="
          
          # 修复MTK GPU驱动的格式警告 - 使用更安全的方法
          GPU_FILE="drivers/gpu/mediatek/gpu_rgx/m1.13ED5776728/services/system/rogue/rgx_mtk/mt6765/mtk_mfgsys.c"
          
          if [ -f "$GPU_FILE" ]; then
            echo "修复GPU文件格式警告..."
            
            # 备份原文件
            cp "$GPU_FILE" "${GPU_FILE}.bak"
            
            # 使用更简单的替换方法，避免复杂的正则表达式
            # 修复(g_pvRegsKM + 0x51c)类型转换问题
            sed -i 's/(g_pvRegsKM + 0x51c)/(unsigned long)(g_pvRegsKM + 0x51c)/g' "$GPU_FILE"
            sed -i 's/(g_pvRegsKM + 0x520)/(unsigned long)(g_pvRegsKM + 0x520)/g' "$GPU_FILE"
            sed -i 's/(g_pvRegsKM + 0x524)/(unsigned long)(g_pvRegsKM + 0x524)/g' "$GPU_FILE"
            sed -i 's/(g_pvRegsKM + 0x528)/(unsigned long)(g_pvRegsKM + 0x528)/g' "$GPU_FILE"
            
            # 修复其他可能的地址
            sed -i 's/(g_pvRegsKM + 0x\([0-9a-fA-F]\{3\}\))/(unsigned long)(g_pvRegsKM + 0x\1)/g' "$GPU_FILE"
            
            # 删除未使用的ERROR标签
            sed -i '/^ERROR:/d' "$GPU_FILE" 2>/dev/null || true
            sed -i 's/goto ERROR;//g' "$GPU_FILE" 2>/dev/null || true
            
            echo "GPU文件修复完成"
          fi
          
          # 修复其他可能的格式问题
          echo "修复其他格式问题..."
          find drivers/gpu/mediatek/ -name "*.c" -type f 2>/dev/null | while read file; do
            # 安全地修复格式字符串
            sed -i 's/"0x%p"/"0x%lx"/g' "$file" 2>/dev/null || true
            sed -i 's/"%p"/"%lx"/g' "$file" 2>/dev/null || true
          done

      - name: Fix Common Issues
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          echo "=== 修复常见问题 ==="
          
          # 1. 修复MTK驱动语法
          if [ -f "drivers/input/input_booster.c" ]; then
            sed -i 's/int is_ib_init_succeed() {/int is_ib_init_succeed(void) {/' drivers/input/input_booster.c
          fi
          
          # 2. 删除4.19不支持的宏
          find . -name "ksu.c" -exec sed -i '/MODULE_IMPORT_NS/d' {} + 2>/dev/null || true
          
          # 3. 修复Makefile中的call函数问题
          if [ -f "Makefile" ]; then
            # 备份
            cp Makefile Makefile.bak
            # 简单修复941行
            sed -i '941s/^/# FIXED: Original line caused issues\n/' Makefile 2>/dev/null || true
          fi

      - name: Setup Configuration
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          DEFCONFIG="arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
          
          echo "配置内核..."
          
          # 添加必要的配置
          {
            echo "CONFIG_MODULES=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUKI_ULTRA=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_HAVE_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_OVERLAY_FS=y"
          } >> "$DEFCONFIG"
          
          # 清理编译标志
          find . -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) \
            -exec sed -i 's/-Werror[^ ]*//g; s/-Wno-error=[^ ]*//g;' {} + 2>/dev/null || true

      - name: Build Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          # 设置环境变量
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
          GCC64="$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin/aarch64-linux-android-"
          GCC32="$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin/arm-linux-androideabi-"
          
          # 彻底禁用所有警告
          export KCFLAGS="-w -Wno-everything"
          export KBUILD_CFLAGS="-w -Wno-everything"
          
          echo "=== 编译环境 ==="
          echo "Clang版本: $(clang --version | head -1)"
          echo "GCC版本: $(${GCC64}gcc --version | head -1)"
          
          # 清理
          echo "清理..."
          make mrproper 2>/dev/null || true
          
          # 生成配置
          echo "生成配置..."
          make ARCH=arm64 CROSS_COMPILE="$GCC64" ${{ env.KERNEL_CONFIG }}
          
          # 确保关键配置
          echo "CONFIG_MODULES=y" >> .config
          echo "CONFIG_KSU=y" >> .config
          
          # 更新配置
          make ARCH=arm64 CROSS_COMPILE="$GCC64" olddefconfig
          
          # 显示关键配置
          echo "关键配置:"
          grep -E "CONFIG_(MODULES|KSU|KPROBES)=" .config || true
          
          # 开始编译
          echo "开始编译内核..."
          
          # 使用简化编译命令
          make -j$(nproc --all) ARCH=arm64 \
            CC="clang" \
            CROSS_COMPILE="$GCC64" \
            CROSS_COMPILE_ARM32="$GCC32" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            KCFLAGS="-w -Wno-everything" \
            2>&1 | tee /tmp/build.log
          
          # 检查结果
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            echo "✅ 编译成功！"
            ls -lh arch/arm64/boot/Image.gz
          else
            echo "❌ 编译失败"
            echo "=== 最后错误 ==="
            tail -50 /tmp/build.log
            exit 1
          fi

      - name: Package Kernel
        if: success()
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          echo "打包内核..."
          
          # 创建输出目录
          OUTPUT_DIR="$GITHUB_WORKSPACE/output"
          mkdir -p "$OUTPUT_DIR"
          
          # 复制内核镜像
          cp arch/arm64/boot/Image.gz "$OUTPUT_DIR/"
          
          # 如果有模块，复制模块
          if [ -d "modules" ]; then
            cp -r modules "$OUTPUT_DIR/" 2>/dev/null || true
          fi
          
          # 创建zip包
          cd "$OUTPUT_DIR"
          zip -r "kernel-a04-$(date +%Y%m%d).zip" *
          
          echo "打包完成:"
          ls -lh *.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A04
          path: |
            ${{ github.workspace }}/output/*.zip
            ${{ github.workspace }}/kernel_workspace/android-kernel/arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Failure-Logs
          path: /tmp/build.log
