name: Build Samsung A04 Kernel (SukiSU-Ultra)

on:
  workflow_dispatch:
    inputs:
      enable_kernelsu:
        description: 'Enable KernelSU'
        type: boolean
        default: true

env:
  KERNEL_SOURCE: https://github.com/rsuntkOrgs/kernel_samsung_wingtech
  KERNEL_BRANCH: android-4.19-stable
  KERNEL_CONFIG: rsuntk-a04_defconfig
  CLANG_VERSION: r450784e
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: "SukiSU"
  KBUILD_BUILD_HOST: "GitHub-Actions"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Workflow
      uses: actions/checkout@v4

    - name: Cleanup Environment
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates ccache curl flex git gnupg \
          libelf-dev libssl-dev libtinfo5 lz4 make python2 python3 \
          python3-pip u-boot-tools unzip wget xz-utils zip zlib1g-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Setup Toolchains
      run: |
        mkdir -p toolchains
        cd toolchains
        
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-${CLANG_VERSION}.tar.gz
        mkdir clang
        tar -xf clang-${CLANG_VERSION}.tar.gz -C clang

        wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz -O gcc64.tar.gz
        mkdir gcc64
        tar -xf gcc64.tar.gz -C gcc64

        wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz -O gcc32.tar.gz
        mkdir gcc32
        tar -xf gcc32.tar.gz -C gcc32

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 -b ${KERNEL_BRANCH} ${KERNEL_SOURCE} android-kernel

    - name: Setup KernelSU
      if: inputs.enable_kernelsu == true
      run: |
        cd android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        
        # --- KernelSU 4.19 兼容性修复合集 ---
        
        # 1. [常规] 修复 Allowlist 警告
        if [ -f "drivers/kernelsu/allowlist.c" ]; then
            sed -i 's/TWA_RESUME/0/g' drivers/kernelsu/allowlist.c
        fi
        
        # 2. [GKI] 删除 MODULE_IMPORT_NS (4.19不支持)
        sed -i '/MODULE_IMPORT_NS/d' drivers/kernelsu/ksu.c
        
        # 3. [Struct] 删除 seccomp.filter_count (旧内核结构体缺失)
        sed -i '/filter_count/d' drivers/kernelsu/app_profile.c

        # 4. [NEW][Header] 修复 pgtable.h 缺失 (关键修复)
        # 将 <linux/pgtable.h> 替换为 <linux/mm.h>
        if [ -f "drivers/kernelsu/sucompat.c" ]; then
            echo "Fixing sucompat.c header include..."
            sed -i 's/<linux\/pgtable.h>/<linux\/mm.h>/g' drivers/kernelsu/sucompat.c
        fi

    - name: Fix Kernel Issues
      run: |
        cd android-kernel
        
        echo "=== Applying General Kernel Fixes ==="

        # 1. 忽略警告 (-Werror -> -Wno-error)
        find . -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} +
        find . -name "Kconfig" -exec sed -i 's/-Werror/-Wno-error/g' {} +

        # 2. VDSO 修复
        sed -i 's/-mcmodel=tiny//g' arch/arm64/kernel/vdso/Makefile
        sed -i 's/ccflags-y := -shared/ccflags-y := -shared --target=aarch64-linux-gnu/g' arch/arm64/kernel/vdso/Makefile
        
        # 3. Python 修复
        sed -i 's/yaml_load(f)/yaml_load(f, Loader=yaml.SafeLoader)/g' scripts/dtc/dtc-lexer.l || true
        
        # 4. 清理无效参数
        find . -name "Makefile" -exec sed -i 's/-fmerge-constants//g' {} +
        find . -name "Makefile" -exec sed -i 's/--param=allow-store-data-races=0//g' {} +

    - name: Configure Kernel
      run: |
        cd android-kernel
        export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH
        
        make O=out ARCH=arm64 ${KERNEL_CONFIG}

        if [ "${{ inputs.enable_kernelsu }}" == "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KSU
            ./scripts/config --file out/.config --enable CONFIG_KPROBES
            ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
            
            # 这里的 SECCOMP 如果开启报错，可以注释掉
            # ./scripts/config --file out/.config --enable CONFIG_SECCOMP
        fi
        
        make O=out ARCH=arm64 olddefconfig

    - name: Build Kernel
      run: |
        cd android-kernel
        export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH
        
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android- \
          CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          Image.gz

    - name: Package Kernel
      run: |
        cd android-kernel
        if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Build Success!"
            mkdir -p upload
            cp out/arch/arm64/boot/Image.gz upload/Image.gz
            find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} upload/ \; || true
            cd upload
            zip -r ../kernel-A04-SukiSU-Ultra.zip .
        else
            echo "Error: Image.gz not found!"
            exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SukiSU-Ultra-A04-Kernel
        path: android-kernel/kernel-*.zip
