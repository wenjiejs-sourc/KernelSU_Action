name: Build Samsung A04 Kernel with SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      enable_kernelsu:
        description: 'Enable KernelSU support'
        type: boolean
        default: true
      use_gcc_for_vdso:
        description: 'Use GCC for VDSO (if Clang fails)'
        type: boolean
        default: false

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Setup environment
      run: |
        echo "KERNEL_SOURCE=https://github.com/rsuntkOrgs/kernel_samsung_wingtech" >> $GITHUB_ENV
        echo "KERNEL_BRANCH=android-4.19-stable" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=rsuntk-a04_defconfig" >> $GITHUB_ENV
        echo "CLANG_BRANCH=master-kernel-build-2022" >> $GITHUB_ENV
        echo "CLANG_VERSION=r450784e" >> $GITHUB_ENV
        echo "ENABLE_KERNELSU=${{ github.event.inputs.enable_kernelsu || 'true' }}" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget curl tar gzip bzip2 \
          make gcc g++ python2 python3 \
          bc flex bison libssl-dev \
          libncurses-dev ccache zip unzip \
          perl device-tree-compiler lzop \
          g++-multilib libxml2-utils
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        
    - name: Download toolchains
      run: |
        mkdir -p toolchains
        cd toolchains
        
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$CLANG_BRANCH/clang-$CLANG_VERSION.tar.gz"
        mkdir -p clang
        tar -C clang -xzf "clang-$CLANG_VERSION.tar.gz"
        
        wget -q -O gcc64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        mkdir -p gcc64
        tar -C gcc64 -xzf gcc64.tar.gz
        
        wget -q -O gcc32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        mkdir -p gcc32
        tar -C gcc32 -xzf gcc32.tar.gz
        
        echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV
        echo "GCC64_PATH=$(pwd)/gcc64/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "GCC32_PATH=$(pwd)/gcc32/bin/arm-linux-androideabi-" >> $GITHUB_ENV
        
    - name: Clone kernel source
      run: |
        git clone --depth=1 --branch="$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel-source
        echo "KERNEL_DIR=$(pwd)/kernel-source" >> $GITHUB_ENV
        
    - name: Setup KernelSU
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $KERNEL_DIR
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        if [ -f "drivers/kernelsu/allowlist.c" ]; then
          sed -i 's/TWA_RESUME/0/g' drivers/kernelsu/allowlist.c
        fi
        
    - name: Fix VDSO for Clang
      run: |
        cd $KERNEL_DIR
        
        cat > arch/arm64/include/asm/vdso/gettimeofday.h << 'HEREDOC_EOF'
        /* SPDX-License-Identifier: GPL-2.0 */
        #ifndef __ASM_VDSO_GETTIMEOFDAY_H
        #define __ASM_VDSO_GETTIMEOFDAY_H
        
        #ifndef __ASSEMBLY__
        
        #include <asm/unistd.h>
        #include <uapi/linux/time.h>
        
        #define VDSO_HAS_TIME 1
        
        static __always_inline
        int gettimeofday_fallback(struct __kernel_old_timeval *_tv,
                                  struct timezone *_tz)
        {
                register struct timezone *tz asm("1") = _tz;
                register struct __kernel_old_timeval *tv asm("0") = _tv;
                register long ret asm("0");
                register long nr asm("8") = __NR_gettimeofday;
        
                asm volatile(
                        "       svc #0\n"
                        : "=r"(ret)
                        : "r"(tv), "r"(tz), "r"(nr)
                        : "memory");
        
                return ret;
        }
        
        static __always_inline
        long clock_gettime_fallback(clockid_t _clkid, struct __kernel_timespec *_ts)
        {
                register struct __kernel_timespec *ts asm("1") = _ts;
                register clockid_t clkid asm("0") = _clkid;
                register long ret asm("0");
                register long nr asm("8") = __NR_clock_gettime;
        
                asm volatile(
                        "       svc #0\n"
                        : "=r"(ret)
                        : "r"(clkid), "r"(ts), "r"(nr)
                        : "memory");
        
                return ret;
        }
        
        static __always_inline
        long clock_getres_fallback(clockid_t _clkid, struct __kernel_timespec *_ts)
        {
                register struct __kernel_timespec *ts asm("1") = _ts;
                register clockid_t clkid asm("0") = _clkid;
                register long ret asm("0");
                register long nr asm("8") = __NR_clock_getres;
        
                asm volatile(
                        "       svc #0\n"
                        : "=r"(ret)
                        : "r"(clkid), "r"(ts), "r"(nr)
                        : "memory");
        
                return ret;
        }
        
        static __always_inline u64 __arch_get_hw_counter(s32 clock_mode)
        {
                u64 res;
                asm volatile("mrs %0, cntvct_el0" : "=r"(res) :: "memory");
                return res;
        }
        
        static __always_inline
        const struct vdso_data *__arch_get_vdso_data(void)
        {
                return _vdso_data;
        }
        
        #ifdef CONFIG_TIME_NS
        static __always_inline
        const struct vdso_data *__arch_get_timens_vdso_data(void)
        {
                return _timens_data;
        }
        #endif
        
        #endif
        #endif
        HEREDOC_EOF
        
        echo "VDSO header fixed for Clang compatibility"
        
    - name: Fix common kernel issues
      run: |
        cd $KERNEL_DIR
        
        echo "/* Fix Clang sp error */" > arch/arm64/include/asm/stack_pointer.h
        
        find arch/arm64 -name "*.c" -o -name "*.h" | xargs sed -i 's/\bcurrent_stack_pointer\b/({ unsigned long sp; asm("mov %0, sp" : "=r"(sp)); sp; })/g'
        
        if [ -f "arch/arm64/include/asm/kgdb.h" ]; then
          sed -i 's/asm ("brk %0" : : "I" (KGDB_COMPILED_DBG_BRK_IMM))/asm ("brk %0" : : "i" (KGDB_COMPILED_DBG_BRK_IMM))/g' arch/arm64/include/asm/kgdb.h
        fi
        
        find . -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) -exec sed -i \
          -e 's/-Wno-error=[^ ]*/-Wno-error/g' \
          -e 's/-Werror=[^ ]*/-Wno-error/g' \
          -e 's/-Werror//g' {} +
        
        find . -name "ksu.c" -exec sed -i '/MODULE_IMPORT_NS/d' {} +
        
        if [ -f "drivers/input/input_booster.c" ]; then
          sed -i 's/int is_ib_init_succeed() {/int is_ib_init_succeed(void) {/' drivers/input/input_booster.c
        fi
    
    - name: Configure and Build kernel
      run: |
        cd $KERNEL_DIR
        export PATH=$CLANG_PATH:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=$GCC64_PATH
        export CROSS_COMPILE_ARM32=$GCC32_PATH
        
        make $KERNEL_CONFIG
        
        cat >> .config << EOF
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_OVERLAY_FS=y
        CONFIG_MODULES=y
        EOF
        
        make olddefconfig
        
        make -j$(nproc) \
          CC="clang" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          HOSTCC="clang" \
          HOSTCXX="clang++" \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          KCFLAGS="-w -Wno-error" \
          KBUILD_CFLAGS="-w -Wno-error" \
          WERROR=0
          
    - name: Package and Upload
      if: success()
      run: |
        cd $KERNEL_DIR
        mkdir -p $GITHUB_WORKSPACE/output
        
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          cp arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/output/
          
          cat > $GITHUB_WORKSPACE/output/build-info.txt << EOF
        Build Time: ${{ env.BUILD_TIME }}
        Kernel Source: ${{ env.KERNEL_SOURCE }}
        Branch: ${{ env.KERNEL_BRANCH }}
        Config: ${{ env.KERNEL_CONFIG }}
        KernelSU: ${{ env.ENABLE_KERNELSU }}
        Clang: ${{ env.CLANG_VERSION }}
        EOF
          
          cd $GITHUB_WORKSPACE/output
          zip -r kernel-A04-SukiSU-${{ env.BUILD_TIME }}.zip .
        else
          echo "Build failed: Image.gz not found"
          ls -la arch/arm64/boot/
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-a04-sukisu-${{ env.BUILD_TIME }}
        path: output/*.zip
