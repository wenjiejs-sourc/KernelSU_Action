name: Build Samsung A04 Kernel (SukiSU-Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KBUILD_BUILD_USER: SukiSU
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Load config.env
        shell: bash
        run: |
          set -a
          source config.env
          set +a

          echo "KERNEL_SOURCE=$KERNEL_SOURCE" >> $GITHUB_ENV
          echo "KERNEL_SOURCE_BRANCH=$KERNEL_SOURCE_BRANCH" >> $GITHUB_ENV
          echo "KERNEL_CONFIG=$KERNEL_CONFIG" >> $GITHUB_ENV
          echo "KERNEL_IMAGE_NAME=$KERNEL_IMAGE_NAME" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV

          echo "CLANG_BRANCH=$CLANG_BRANCH" >> $GITHUB_ENV
          echo "CLANG_VERSION=$CLANG_VERSION" >> $GITHUB_ENV

          echo "ENABLE_GCC_64=$ENABLE_GCC_64" >> $GITHUB_ENV
          echo "ENABLE_GCC_32=$ENABLE_GCC_32" >> $GITHUB_ENV

          echo "ROOT_SOLUTION=$ROOT_SOLUTION" >> $GITHUB_ENV
          echo "SUKISU_VARIANT=$SUKISU_VARIANT" >> $GITHUB_ENV

          echo "ADD_KSU_CONFIG=$ADD_KSU_CONFIG" >> $GITHUB_ENV
          echo "ADD_KPROBES_CONFIG=$ADD_KPROBES_CONFIG" >> $GITHUB_ENV
          echo "ADD_OVERLAYFS_CONFIG=$ADD_OVERLAYFS_CONFIG" >> $GITHUB_ENV
          echo "ADD_KALLSYMS_CONFIG=$ADD_KALLSYMS_CONFIG" >> $GITHUB_ENV
          echo "ADD_KPM_CONFIG=$ADD_KPM_CONFIG" >> $GITHUB_ENV

          echo "DISABLE_LTO=$DISABLE_LTO" >> $GITHUB_ENV
          echo "DISABLE_CC_WERROR=$DISABLE_CC_WERROR" >> $GITHUB_ENV
          echo "REMOVE_INVALID_FLAGS=$REMOVE_INVALID_FLAGS" >> $GITHUB_ENV
          echo "FIX_VDSO_CLANG=$FIX_VDSO_CLANG" >> $GITHUB_ENV
          echo "PYTHON_SAFELOADER_FIX=$PYTHON_SAFELOADER_FIX" >> $GITHUB_ENV

          echo "ENABLE_CCACHE=$ENABLE_CCACHE" >> $GITHUB_ENV
          echo "REMOVE_UNUSED_PACKAGES=$REMOVE_UNUSED_PACKAGES" >> $GITHUB_ENV
          echo "BUILD_BOOT_IMG=$BUILD_BOOT_IMG" >> $GITHUB_ENV
          echo "VERBOSE_BUILD=$VERBOSE_BUILD" >> $GITHUB_ENV
          echo "KEEP_BUILD_LOG=$KEEP_BUILD_LOG" >> $GITHUB_ENV

      - name: Cleanup environment
        shell: bash
        run: |
          if [ "$REMOVE_UNUSED_PACKAGES" = "true" ]; then
            sudo rm -rf /usr/share/dotnet || true
            sudo rm -rf /opt/ghc || true
            sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          fi

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex git gnupg \
            libelf-dev libssl-dev libtinfo5 lz4 make python2 python3 python3-pip \
            u-boot-tools unzip wget xz-utils zip zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: Setup toolchains
        shell: bash
        run: |
          mkdir -p toolchains
          cd toolchains

          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/clang-${CLANG_VERSION}.tar.gz"
          mkdir -p clang
          tar -xf "clang-${CLANG_VERSION}.tar.gz" -C clang

          if [ "$ENABLE_GCC_64" = "true" ]; then
            wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" -O gcc64.tar.gz
            mkdir -p gcc64
            tar -xf gcc64.tar.gz -C gcc64
          fi

          if [ "$ENABLE_GCC_32" = "true" ]; then
            wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" -O gcc32.tar.gz
            mkdir -p gcc32
            tar -xf gcc32.tar.gz -C gcc32
          fi

      - name: Clone kernel source
        shell: bash
        run: |
          git clone --depth=1 -b "${KERNEL_SOURCE_BRANCH}" "${KERNEL_SOURCE}" android-kernel

      - name: Integrate SukiSU-Ultra
        shell: bash
        run: |
          cd android-kernel

          if [ "${ROOT_SOLUTION}" != "sukisu-ultra" ]; then
            echo "Unsupported ROOT_SOLUTION=${ROOT_SOLUTION}"
            exit 1
          fi

          # non-GKI / built-in 走 builtin
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${SUKISU_VARIANT}"

      - name: Apply general kernel fixes
        shell: bash
        run: |
          cd android-kernel

          if [ "$DISABLE_CC_WERROR" = "true" ]; then
            find . -name "Makefile" -exec sed -i 's/-Werror/-Wno-error/g' {} + || true
            find . -name "Kconfig" -exec sed -i 's/-Werror/-Wno-error/g' {} + || true
          fi

          if [ "$FIX_VDSO_CLANG" = "true" ] && [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-mcmodel=tiny//g' arch/arm64/kernel/vdso/Makefile || true
            sed -i 's/ccflags-y := -shared/ccflags-y := -shared --target=aarch64-linux-gnu/g' arch/arm64/kernel/vdso/Makefile || true
          fi

          if [ "$PYTHON_SAFELOADER_FIX" = "true" ]; then
            sed -i 's/yaml_load(f)/yaml_load(f, Loader=yaml.SafeLoader)/g' scripts/dtc/dtc-lexer.l || true
          fi

          if [ "$REMOVE_INVALID_FLAGS" = "true" ]; then
            find . -name "Makefile" -exec sed -i 's/-fmerge-constants//g' {} + || true
            find . -name "Makefile" -exec sed -i 's/--param=allow-store-data-races=0//g' {} + || true
          fi

      - name: Configure kernel
        shell: bash
        run: |
          cd android-kernel
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"

          make O=out ARCH=${ARCH} ${KERNEL_CONFIG}

          if [ "$ADD_KSU_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KSU || true
          fi

          if [ "$ADD_KPROBES_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KPROBES || true
            ./scripts/config --file out/.config --enable CONFIG_KRETPROBES || true
          fi

          if [ "$ADD_OVERLAYFS_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS || true
          fi

          if [ "$ADD_KALLSYMS_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KALLSYMS || true
            ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL || true
          fi

          if [ "$ADD_KPM_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KPM || true
          fi

          if [ "$DISABLE_LTO" = "true" ]; then
            ./scripts/config --file out/.config --disable LTO || true
            ./scripts/config --file out/.config --disable LTO_CLANG || true
            ./scripts/config --file out/.config --disable THINLTO || true
            ./scripts/config --file out/.config --disable FULL_LTO || true
          fi

          make O=out ARCH=${ARCH} olddefconfig

          echo "===== Final Config Check ====="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_OVERLAY_FS|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_KPM" out/.config || true

      - name: Build kernel
        shell: bash
        run: |
          cd android-kernel
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"

          MAKE_ARGS=(
            -j"$(nproc --all)"
            O=out
            ARCH=${ARCH}
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
          )

          if [ "$ENABLE_GCC_64" = "true" ]; then
            MAKE_ARGS+=(CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-)
          fi

          if [ "$ENABLE_GCC_32" = "true" ]; then
            MAKE_ARGS+=(CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-)
          fi

          if [ "$VERBOSE_BUILD" = "true" ]; then
            MAKE_ARGS+=(V=1)
          fi

          make "${MAKE_ARGS[@]}" ${KERNEL_IMAGE_NAME} 2>&1 | tee build.log

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android-kernel/build.log

      - name: Package kernel artifact
        shell: bash
        run: |
          cd android-kernel

          if [ ! -f "out/arch/arm64/boot/${KERNEL_IMAGE_NAME}" ]; then
            echo "Build failed: ${KERNEL_IMAGE_NAME} not found"
            exit 1
          fi

          mkdir -p upload
          cp "out/arch/arm64/boot/${KERNEL_IMAGE_NAME}" "upload/${KERNEL_IMAGE_NAME}"

          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} upload/ \; || true
          find out/arch/arm64/boot/dts -name "*.dtbo" -exec cp {} upload/ \; || true

          cd upload
          zip -r ../kernel-A04-SukiSU-Ultra.zip .

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-A04-Kernel
          path: android-kernel/kernel-A04-SukiSU-Ultra.zip
