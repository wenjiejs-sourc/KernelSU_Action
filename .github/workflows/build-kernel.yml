name: Build Samsung A04 Kernel (SukiSU-Ultra)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KBUILD_BUILD_USER: SukiSU
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Load config.env
        shell: bash
        run: |
          set -euo pipefail
          test -f config.env

          echo "===== config.env ====="
          cat config.env
          echo "======================"

          set -a
          source config.env
          set +a

          : "${KERNEL_SOURCE:?KERNEL_SOURCE is missing}"
          : "${KERNEL_SOURCE_BRANCH:?KERNEL_SOURCE_BRANCH is missing}"
          : "${KERNEL_CONFIG:?KERNEL_CONFIG is missing}"
          : "${KERNEL_IMAGE_NAME:?KERNEL_IMAGE_NAME is missing}"
          : "${ARCH:?ARCH is missing}"
          : "${CLANG_BRANCH:?CLANG_BRANCH is missing}"
          : "${CLANG_VERSION:?CLANG_VERSION is missing}"
          : "${ENABLE_GCC_64:?ENABLE_GCC_64 is missing}"
          : "${ENABLE_GCC_32:?ENABLE_GCC_32 is missing}"
          : "${ROOT_SOLUTION:?ROOT_SOLUTION is missing}"
          : "${SUKISU_VARIANT:?SUKISU_VARIANT is missing}"
          : "${ADD_KSU_CONFIG:?ADD_KSU_CONFIG is missing}"
          : "${ADD_KPROBES_CONFIG:?ADD_KPROBES_CONFIG is missing}"
          : "${ADD_OVERLAYFS_CONFIG:?ADD_OVERLAYFS_CONFIG is missing}"
          : "${ADD_KALLSYMS_CONFIG:?ADD_KALLSYMS_CONFIG is missing}"
          : "${ADD_KPM_CONFIG:?ADD_KPM_CONFIG is missing}"
          : "${DISABLE_LTO:?DISABLE_LTO is missing}"
          : "${DISABLE_CC_WERROR:?DISABLE_CC_WERROR is missing}"
          : "${REMOVE_INVALID_FLAGS:?REMOVE_INVALID_FLAGS is missing}"
          : "${FIX_VDSO_CLANG:?FIX_VDSO_CLANG is missing}"
          : "${PYTHON_SAFELOADER_FIX:?PYTHON_SAFELOADER_FIX is missing}"
          : "${ENABLE_CCACHE:?ENABLE_CCACHE is missing}"
          : "${REMOVE_UNUSED_PACKAGES:?REMOVE_UNUSED_PACKAGES is missing}"
          : "${BUILD_BOOT_IMG:?BUILD_BOOT_IMG is missing}"
          : "${VERBOSE_BUILD:?VERBOSE_BUILD is missing}"
          : "${KEEP_BUILD_LOG:?KEEP_BUILD_LOG is missing}"

          {
            echo "KERNEL_SOURCE=$KERNEL_SOURCE"
            echo "KERNEL_SOURCE_BRANCH=$KERNEL_SOURCE_BRANCH"
            echo "KERNEL_CONFIG=$KERNEL_CONFIG"
            echo "KERNEL_IMAGE_NAME=$KERNEL_IMAGE_NAME"
            echo "ARCH=$ARCH"
            echo "CLANG_BRANCH=$CLANG_BRANCH"
            echo "CLANG_VERSION=$CLANG_VERSION"
            echo "ENABLE_GCC_64=$ENABLE_GCC_64"
            echo "ENABLE_GCC_32=$ENABLE_GCC_32"
            echo "ROOT_SOLUTION=$ROOT_SOLUTION"
            echo "SUKISU_VARIANT=$SUKISU_VARIANT"
            echo "ADD_KSU_CONFIG=$ADD_KSU_CONFIG"
            echo "ADD_KPROBES_CONFIG=$ADD_KPROBES_CONFIG"
            echo "ADD_OVERLAYFS_CONFIG=$ADD_OVERLAYFS_CONFIG"
            echo "ADD_KALLSYMS_CONFIG=$ADD_KALLSYMS_CONFIG"
            echo "ADD_KPM_CONFIG=$ADD_KPM_CONFIG"
            echo "DISABLE_LTO=$DISABLE_LTO"
            echo "DISABLE_CC_WERROR=$DISABLE_CC_WERROR"
            echo "REMOVE_INVALID_FLAGS=$REMOVE_INVALID_FLAGS"
            echo "FIX_VDSO_CLANG=$FIX_VDSO_CLANG"
            echo "PYTHON_SAFELOADER_FIX=$PYTHON_SAFELOADER_FIX"
            echo "ENABLE_CCACHE=$ENABLE_CCACHE"
            echo "REMOVE_UNUSED_PACKAGES=$REMOVE_UNUSED_PACKAGES"
            echo "BUILD_BOOT_IMG=$BUILD_BOOT_IMG"
            echo "VERBOSE_BUILD=$VERBOSE_BUILD"
            echo "KEEP_BUILD_LOG=$KEEP_BUILD_LOG"
          } >> "$GITHUB_ENV"

      - name: Print build target
        shell: bash
        run: |
          echo "KERNEL_SOURCE=$KERNEL_SOURCE"
          echo "KERNEL_SOURCE_BRANCH=$KERNEL_SOURCE_BRANCH"
          echo "KERNEL_CONFIG=$KERNEL_CONFIG"
          echo "KERNEL_IMAGE_NAME=$KERNEL_IMAGE_NAME"
          echo "ARCH=$ARCH"
          echo "ROOT_SOLUTION=$ROOT_SOLUTION"
          echo "SUKISU_VARIANT=$SUKISU_VARIANT"

      - name: Cleanup environment
        shell: bash
        run: |
          if [ "$REMOVE_UNUSED_PACKAGES" = "true" ]; then
            sudo rm -rf /usr/share/dotnet || true
            sudo rm -rf /opt/ghc || true
            sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          fi

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl dos2unix file flex git gnupg \
            libelf-dev libssl-dev libtinfo5 lz4 make perl python2 python3 python3-pip \
            u-boot-tools unzip wget xz-utils zip zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

          sudo ln -sf /usr/bin/python2 /usr/bin/python || true

      - name: Setup ccache
        if: env.ENABLE_CCACHE == 'true'
        shell: bash
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          ccache -M 2G || true
          ccache --version || true

      - name: Setup toolchains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchains
          cd toolchains

          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${CLANG_BRANCH}/clang-${CLANG_VERSION}.tar.gz"
          mkdir -p clang
          tar -xf "clang-${CLANG_VERSION}.tar.gz" -C clang

          if [ "$ENABLE_GCC_64" = "true" ]; then
            wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" -O gcc64.tar.gz
            mkdir -p gcc64
            tar -xf gcc64.tar.gz -C gcc64
          fi

          if [ "$ENABLE_GCC_32" = "true" ]; then
            wget -q "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz" -O gcc32.tar.gz
            mkdir -p gcc32
            tar -xf gcc32.tar.gz -C gcc32
          fi

      - name: Debug toolchain paths
        shell: bash
        run: |
          ls -lah "$GITHUB_WORKSPACE/toolchains" || true
          ls -lah "$GITHUB_WORKSPACE/toolchains/clang/bin" || true
          ls -lah "$GITHUB_WORKSPACE/toolchains/gcc64/bin" || true
          ls -lah "$GITHUB_WORKSPACE/toolchains/gcc32/bin" || true

      - name: Clone kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 -b "${KERNEL_SOURCE_BRANCH}" "${KERNEL_SOURCE}" android-kernel

      - name: Show kernel source info
        shell: bash
        run: |
          cd android-kernel
          git rev-parse --short HEAD || true
          git branch || true
          ls arch/arm64/configs | grep -i "$(echo "$KERNEL_CONFIG" | sed 's/_defconfig$//')" || true

      - name: Sanitize kernel tree text files
        shell: bash
        run: |
          set -euo pipefail
          cd android-kernel

          # 统一转 LF
          find . \( -name "Kconfig" -o -name "Kconfig.*" -o -name "Makefile" -o -name "*.mk" -o -name "*defconfig" \) \
            -type f -exec dos2unix {} \; || true

          # 去 BOM / 去 CR
          find . \( -name "Kconfig" -o -name "Kconfig.*" -o -name "Makefile" -o -name "*.mk" -o -name "*defconfig" \) \
            -type f -print0 | while IFS= read -r -d '' f; do
              sed -i '1s/^\xEF\xBB\xBF//' "$f" || true
              sed -i 's/\r$//' "$f" || true
            done

          # Kconfig 常见脏内容修复：
          # 1. 删掉只有单引号的脏行
          # 2. 删掉 patch 残留的行首 '+'
          find . \( -name "Kconfig" -o -name "Kconfig.*" \) -type f -print0 | while IFS= read -r -d '' f; do
            perl -0pi -e "s/^\s*'\s*\n//mg" "$f" || true
            perl -0pi -e 's/^\+//mg' "$f" || true
          done

          echo "===== init/Kconfig ====="
          cat -A init/Kconfig | sed -n '1,40p' || true

          echo "===== drivers/input/hx9031a_sar/Kconfig ====="
          cat -A drivers/input/hx9031a_sar/Kconfig | sed -n '1,40p' || true

          echo "===== drivers/misc/mediatek/typec/tcpc/aw35615/Kconfig ====="
          cat -A drivers/misc/mediatek/typec/tcpc/aw35615/Kconfig | sed -n '1,40p' || true

          echo "===== drivers/input/touchscreen/mediatek/hxchipset_hx83108x/Kconfig ====="
          cat -A drivers/input/touchscreen/mediatek/hxchipset_hx83108x/Kconfig | sed -n '1,80p' || true

      - name: Integrate SukiSU-Ultra
        shell: bash
        run: |
          set -euo pipefail
          cd android-kernel

          if [ "${ROOT_SOLUTION}" != "sukisu-ultra" ]; then
            echo "Unsupported ROOT_SOLUTION=${ROOT_SOLUTION}"
            exit 1
          fi

          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${SUKISU_VARIANT}"

      - name: Apply general kernel fixes
        shell: bash
        run: |
          cd android-kernel

          if [ "$DISABLE_CC_WERROR" = "true" ]; then
            find . \( -name "Makefile" -o -name "Kbuild" \) -type f -exec sed -i 's/-Werror/-Wno-error/g' {} + || true
          fi

          if [ "$FIX_VDSO_CLANG" = "true" ] && [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-mcmodel=tiny//g' arch/arm64/kernel/vdso/Makefile || true
            sed -i 's/ccflags-y := -shared/ccflags-y := -shared --target=aarch64-linux-gnu/g' arch/arm64/kernel/vdso/Makefile || true
          fi

          if [ "$PYTHON_SAFELOADER_FIX" = "true" ]; then
            sed -i 's/yaml.load(f)/yaml.load(f, Loader=yaml.SafeLoader)/g' scripts/dtc/pylibfdt/setup.py || true
            sed -i 's/yaml_load(f)/yaml_load(f, Loader=yaml.SafeLoader)/g' scripts/dtc/dtc-lexer.l || true
          fi

          if [ "$REMOVE_INVALID_FLAGS" = "true" ]; then
            find . -name "Makefile" -type f -exec sed -i 's/-fmerge-constants//g' {} + || true
            find . -name "Makefile" -type f -exec sed -i 's/--param=allow-store-data-races=0//g' {} + || true
            find . -name "Makefile" -type f -exec sed -i 's/-Wimplicit-fallthrough=5/-Wimplicit-fallthrough/g' {} + || true
          fi

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail
          cd android-kernel
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"

          make O=out ARCH="${ARCH}" "${KERNEL_CONFIG}"

          if [ "$ADD_KSU_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KSU || true
          fi

          if [ "$ADD_KPROBES_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KPROBES || true
            ./scripts/config --file out/.config --enable CONFIG_KRETPROBES || true
          fi

          if [ "$ADD_OVERLAYFS_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS || true
          fi

          if [ "$ADD_KALLSYMS_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KALLSYMS || true
            ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL || true
          fi

          if [ "$ADD_KPM_CONFIG" = "true" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KPM || true
          fi

          if [ "$DISABLE_LTO" = "true" ]; then
            ./scripts/config --file out/.config --disable LTO || true
            ./scripts/config --file out/.config --disable LTO_CLANG || true
            ./scripts/config --file out/.config --disable THINLTO || true
            ./scripts/config --file out/.config --disable FULL_LTO || true
          fi

          make O=out ARCH="${ARCH}" olddefconfig

          echo "===== Final Config Check ====="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_OVERLAY_FS|CONFIG_KALLSYMS|CONFIG_KALLSYMS_ALL|CONFIG_KPM" out/.config || true

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          cd android-kernel
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH"

          TOOL_CC="clang"
          if [ "${ENABLE_CCACHE}" = "true" ]; then
            TOOL_CC="ccache clang"
          fi

          MAKE_ARGS=(
            "-j$(nproc --all)"
            "O=out"
            "ARCH=${ARCH}"
            "CC=${TOOL_CC}"
            "CLANG_TRIPLE=aarch64-linux-gnu-"
            "LD=ld.lld"
            "AR=llvm-ar"
            "NM=llvm-nm"
            "OBJCOPY=llvm-objcopy"
            "OBJDUMP=llvm-objdump"
            "STRIP=llvm-strip"
          )

          if [ "${ENABLE_GCC_64}" = "true" ]; then
            MAKE_ARGS+=("CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/gcc64/bin/aarch64-linux-android-")
          fi

          if [ "${ENABLE_GCC_32}" = "true" ]; then
            MAKE_ARGS+=("CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchains/gcc32/bin/arm-linux-androideabi-")
          fi

          if [ "${VERBOSE_BUILD}" = "true" ]; then
            MAKE_ARGS+=("V=1")
          fi

          printf 'MAKE_ARGS:\n'
          printf '  %q\n' "${MAKE_ARGS[@]}"

          make "${MAKE_ARGS[@]}" "${KERNEL_IMAGE_NAME}" 2>&1 | tee build.log

      - name: Save build log
        if: always() && env.KEEP_BUILD_LOG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android-kernel/build.log

      - name: Package kernel artifact
        shell: bash
        run: |
          set -euo pipefail
          cd android-kernel

          if [ ! -f "out/arch/arm64/boot/${KERNEL_IMAGE_NAME}" ]; then
            echo "Build failed: ${KERNEL_IMAGE_NAME} not found"
            exit 1
          fi

          mkdir -p upload
          cp "out/arch/arm64/boot/${KERNEL_IMAGE_NAME}" "upload/${KERNEL_IMAGE_NAME}"

          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} upload/ \; || true
          find out/arch/arm64/boot/dts -name "*.dtbo" -exec cp {} upload/ \; || true

          cd upload
          zip -r ../kernel-A04-SukiSU-Ultra.zip .

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-A04-Kernel
          path: android-kernel/kernel-A04-SukiSU-Ultra.zip
