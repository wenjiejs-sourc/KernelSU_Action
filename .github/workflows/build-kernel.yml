name: Build Samsung A04 SukiSU-Ultra
on:
  workflow_dispatch:

jobs:
  build:
    name: Build SukiSU-Ultra by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Configuration
        run: |
          if [ -f "config.env" ]; then
            sed -i 's/ *= */=/g' config.env
            grep -v '^#' config.env | grep '=' >> $GITHUB_ENV
          else
            echo "Error: config.env not found!"
            exit 1
          fi

      - name: Setup build kernel environment
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake flex lzop bison gperf build-essential zip curl \
            zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
            libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev \
            liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl \
            policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc \
            libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev \
            libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 python3
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: Download Clang and GCC
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          # Clang
          mkdir clang-aosp
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${{ env.CLANG_BRANCH }}/clang-${{ env.CLANG_VERSION }}.tar.gz"
          tar -C clang-aosp/ -zxvf "clang-${{ env.CLANG_VERSION }}.tar.gz"
          # GCC 64
          mkdir gcc-64
          wget -q -O gcc-aarch64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc-64/ -zxvf gcc-aarch64.tar.gz
          # GCC 32
          mkdir gcc-32
          wget -q -O gcc-arm.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          tar -C gcc-32/ -zxvf gcc-arm.tar.gz

      - name: Download kernel source
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

      - name: Setup SukiSU-Ultra
        if: env.ENABLE_KERNELSU == 'true'
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: Setup Configuration for Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          DEFCONFIG="arch/arm64/configs/${{ env.KERNEL_CONFIG }}"
          
          # 1. 注入基础配置
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUKI_ULTRA=y" >> $DEFCONFIG
          echo "CONFIG_MODULES=y" >> $DEFCONFIG
          
          # 2. 彻底清洗带等号的参数 (解决 scripts/mod 报错)
          find . -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) -exec sed -i \
            -e 's/-Wno-error=[^ ]*/-Wno-error/g' \
            -e 's/-Werror=[^ ]*/-Wno-error/g' \
            -e 's/-Werror//g' \
            -e 's/-implicit-function-declaration/-Wno-implicit-function-declaration/g' {} +
          
          # 3. 彻底删除 4.19 不支持的宏 (解决 ksu.c 报错)
          find . -name "ksu.c" -exec sed -i '/MODULE_IMPORT_NS/d' {} +
          
          # 4. 修复 MTK 驱动语法
          [ -f "drivers/input/input_booster.c" ] && sed -i 's/int is_ib_init_succeed() {/int is_ib_init_succeed(void) {/' drivers/input/input_booster.c

      - name: Build Kernel
        run: |
          # 进入内核目录
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          # 1. 自动修复所有文件的换行符 (解决 Kconfig 和 Makefile 解析错误)
          echo "正在修复换行符和非法字符..."
          find . -type f \( -name "Makefile*" -o -name "Kbuild*" -o -name "Kconfig*" -o -name "*.h" -o -name "*.c" -o -name "*.mk" \) -exec sed -i 's/\r//g' {} +
          
          # 2. 修复特定的Makefile语法错误
          echo "正在检查Makefile语法错误..."
          if [ -f "Makefile" ]; then
            # 修复第938行可能的call函数问题
            sed -i '938s/^/# Fix: /' Makefile
            # 或者查看具体内容
            echo "Makefile 938行内容:"
            sed -n '935,945p' Makefile
          fi
          
          # 3. 检查所有Makefile的call函数调用
          echo "检查Makefile中的call函数..."
          find . -name "Makefile" -o -name "Makefile.*" | while read file; do
            echo "检查文件: $file"
            grep -n "call.*[^)]$" "$file" || true
          done
          
          # 4. 移除可能导致解析失败的非法 '+' 号
          find drivers/input/touchscreen/ -name "Kconfig*" -exec sed -i 's/^+//g; s/ +/ /g' {} +
        
          # 5. 设置环境变量
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/bin:$PATH
          GCC64="$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin/aarch64-linux-android-"
          GCC32="$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin/arm-linux-androideabi-"
          
          # 强制禁用警告转错误
          export KCFLAGS="-w -Wno-error"
          export KCPPFLAGS="-w -Wno-error"
          
          # 6. 首先验证环境
          echo "验证编译工具链..."
          ${GCC64}gcc --version || echo "GCC64 工具链检查失败"
          clang --version || echo "Clang 检查失败"
          
          # 7. 清理之前的构建
          echo "清理之前的构建..."
          make mrproper || true
          rm -rf out || true
          
          # 8. 生成配置 (使用更简单的方式)
          echo "正在生成配置: $KERNEL_CONFIG"
          make ARCH=arm64 CROSS_COMPILE=$GCC64 $KERNEL_CONFIG O=out
          
          # 9. 检查生成的.config
          echo "检查.config文件..."
          grep "CONFIG_MODULES=y" out/.config || echo "警告: CONFIG_MODULES未启用"
          
          # 10. 编译内核（使用简化参数）
          echo "开始编译内核..."
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$GCC64 \
            CROSS_COMPILE_ARM32=$GCC32
      
      - name: Upload Artifact
        run: |
          if [ -f "kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz" ]; then
            cd kernel_workspace/android-kernel/out/arch/arm64/boot/
            zip -r ../../../../kernel-A04.zip Image.gz
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Kernel-A04
          path: kernel-A04.zip
