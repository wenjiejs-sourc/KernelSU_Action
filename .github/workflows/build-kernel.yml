name: Build Samsung A04 Kernel with SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      enable_kernelsu:
        description: 'Enable KernelSU support'
        type: boolean
        default: true

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup environment
      run: |
        echo "KERNEL_SOURCE=https://github.com/rsuntkOrgs/kernel_samsung_wingtech" >> $GITHUB_ENV
        echo "KERNEL_BRANCH=android-4.19-stable" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=rsuntk-a04_defconfig" >> $GITHUB_ENV
        echo "CLANG_VERSION=r450784e" >> $GITHUB_ENV
        echo "ENABLE_KERNELSU=${{ github.event.inputs.enable_kernelsu || 'true' }}" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget curl tar gzip bzip2 \
          make gcc g++ python2 python3 \
          bc flex bison libssl-dev \
          libncurses-dev ccache zip unzip
        
    - name: Clone kernel source
      run: |
        git clone --depth=1 --branch="$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel
        cd kernel
        echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
        
    - name: Setup KernelSU
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $KERNEL_DIR
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
    - name: Fix kernel issues
      run: |
        cd $KERNEL_DIR
        
        # Fix common issues
        find . -name "*.c" -o -name "*.h" -o -name "Makefile*" -o -name "Kconfig*" | \
          xargs sed -i 's/\r//g' 2>/dev/null || true
        
        # Fix KSU for 4.19 kernel
        if [ -f "drivers/kernelsu/allowlist.c" ]; then
          sed -i 's/TWA_RESUME/0/g' drivers/kernelsu/allowlist.c
        fi
        
        # Create missing header file
        if [ ! -f "kernel/trace/mtk_ftrace.h" ]; then
          mkdir -p kernel/trace
          cat > kernel/trace/mtk_ftrace.h << 'EOF'
#ifndef _MTK_FTRACE_H
#define _MTK_FTRACE_H
#include <linux/trace_events.h>
#endif
EOF
        fi
        
    - name: Build kernel
      run: |
        cd $KERNEL_DIR
        
        # Setup environment
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Generate config
        make $KERNEL_CONFIG
        
        # Add required configs
        echo "CONFIG_MODULES=y" >> .config
        echo "CONFIG_KSU=y" >> .config
        echo "CONFIG_KPROBES=y" >> .config
        echo "CONFIG_OVERLAY_FS=y" >> .config
        echo "CONFIG_MTK_TRACE=n" >> .config
        
        # Build kernel
        make -j$(nproc) Image.gz
        
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          echo "✅ Kernel built successfully!"
          ls -lh arch/arm64/boot/Image.gz
        else
          echo "❌ Kernel build failed"
          exit 1
        fi
        
    - name: Package kernel
      if: success()
      run: |
        cd $KERNEL_DIR
        
        mkdir -p $GITHUB_WORKSPACE/output
        cp arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/output/
        
        cd $GITHUB_WORKSPACE/output
        zip -r kernel_a04_$BUILD_TIME.zip *
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: output/*
