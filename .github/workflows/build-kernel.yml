name: Build Samsung A04 Kernel with SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      enable_kernelsu:
        description: 'Enable KernelSU support'
        type: boolean
        default: true

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Setup environment
      run: |
        echo "KERNEL_SOURCE=https://github.com/rsuntkOrgs/kernel_samsung_wingtech" >> $GITHUB_ENV
        echo "KERNEL_BRANCH=android-4.19-stable" >> $GITHUB_ENV
        echo "KERNEL_CONFIG=rsuntk-a04_defconfig" >> $GITHUB_ENV
        echo "CLANG_BRANCH=master-kernel-build-2022" >> $GITHUB_ENV
        echo "CLANG_VERSION=r450784e" >> $GITHUB_ENV
        echo "ENABLE_KERNELSU=${{ github.event.inputs.enable_kernelsu || 'true' }}" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget curl tar gzip bzip2 \
          make gcc g++ python2 python3 \
          bc flex bison libssl-dev \
          libncurses-dev ccache zip unzip \
          perl device-tree-compiler lzop \
          g++-multilib libxml2-utils
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        
    - name: Download toolchains
      run: |
        mkdir -p toolchains
        cd toolchains
        
        # Download Clang
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$CLANG_BRANCH/clang-$CLANG_VERSION.tar.gz"
        mkdir -p clang
        tar -C clang -xzf "clang-$CLANG_VERSION.tar.gz"
        
        # Download GCC 64-bit
        wget -q -O gcc64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        mkdir -p gcc64
        tar -C gcc64 -xzf gcc64.tar.gz
        
        # Download GCC 32-bit
        wget -q -O gcc32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        mkdir -p gcc32
        tar -C gcc32 -xzf gcc32.tar.gz
        
        echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV
        echo "GCC64_PATH=$(pwd)/gcc64/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "GCC32_PATH=$(pwd)/gcc32/bin/arm-linux-androideabi-" >> $GITHUB_ENV
        
    - name: Clone kernel source
      run: |
        git clone --depth=1 --branch="$KERNEL_BRANCH" "$KERNEL_SOURCE" kernel-source
        echo "KERNEL_DIR=$(pwd)/kernel-source" >> $GITHUB_ENV
        
    - name: Setup KernelSU
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $KERNEL_DIR
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        # 修复 4.19 的 TWA_RESUME 问题
        if [ -f "drivers/kernelsu/allowlist.c" ]; then
          sed -i 's/TWA_RESUME/0/g' drivers/kernelsu/allowlist.c
        fi
        
    - name: Fix common kernel issues
      run: |
        cd $KERNEL_DIR
        
        # 1. 修复全局寄存器变量 'sp' 报错 (针对 Clang)
        # 将 register unsigned long current_stack_pointer asm ("sp") 替换为内联函数
        sed -i 's/register unsigned long current_stack_pointer asm ("sp");/static inline unsigned long get_current_stack_pointer(void) { unsigned long sp; asm("mov %0, sp" : "=r"(sp)); return sp; }/g' arch/arm64/include/asm/stack_pointer.h
        # 替换源码中对该变量的调用
        find arch/arm64 -name "*.c" -o -name "*.h" | xargs sed -i 's/current_stack_pointer/get_current_stack_pointer()/g'

        # 2. 修复 KGDB 'brk 1025' 约束报错
        # 改变汇编约束，从 "I" (立即数) 改为 "i" (允许符号/常数)
        sed -i 's/asm ("brk %0" : : "I" (KGDB_COMPILED_DBG_BRK_IMM))/asm ("brk %0" : : "i" (KGDB_COMPILED_DBG_BRK_IMM))/g' arch/arm64/include/asm/kgdb.h

        # 3. 之前已有的修复 (保留)
        find . -type f \( -name "Makefile" -o -name "Kbuild" -o -name "*.mk" \) -exec sed -i \
          -e 's/-Wno-error=[^ ]*/-Wno-error/g' \
          -e 's/-Werror=[^ ]*/-Wno-error/g' \
          -e 's/-Werror//g' {} +
        find . -name "ksu.c" -exec sed -i '/MODULE_IMPORT_NS/d' {} +
        [ -f "drivers/input/input_booster.c" ] && sed -i 's/int is_ib_init_succeed() {/int is_ib_init_succeed(void) {/' drivers/input/input_booster.c

    - name: Configure and Build kernel
      run: |
        cd $KERNEL_DIR
        export PATH=$CLANG_PATH:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=$GCC64_PATH
        export CROSS_COMPILE_ARM32=$GCC32_PATH
        
        # 生成配置
        make $KERNEL_CONFIG
        
        # 注入必要内核参数
        cat >> .config << EOF
        CONFIG_KSU=y
        CONFIG_KPROBES=y
        CONFIG_OVERLAY_FS=y
        CONFIG_MODULES=y
        EOF
        make olddefconfig

        # 正式编译，强制注入 KCFLAGS 屏蔽所有警告报错
        make -j$(nproc) \
          CC="clang" \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          LD=ld.lld \
          KCFLAGS="-w -Wno-error" \
          KBUILD_CFLAGS="-w -Wno-error" \
          WERROR=0
          
    - name: Package and Upload
      if: success()
      run: |
        cd $KERNEL_DIR
        mkdir -p $GITHUB_WORKSPACE/output
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          cp arch/arm64/boot/Image.gz $GITHUB_WORKSPACE/output/
          cd $GITHUB_WORKSPACE/output
          zip -r kernel-A04-SukiSU.zip .
        else
          echo "Build failed: Image.gz not found"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-a04-result
        path: output/*.zip
